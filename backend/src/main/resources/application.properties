# =============================================
# Application Configuration
# =============================================

# Server port (default is 8080)
server.port=8080

# =============================================
# PostgreSQL Database Configuration
# =============================================

# Change these values to match your local PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5432/tradedb
spring.datasource.username=postgres
spring.datasource.password=kloOod010203@@
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate Configuration
# =============================================

# "validate" checks DB matches entities — use "update" during development
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate to use PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Runs schema.sql on startup to create tables
spring.sql.init.mode=always

# =============================================
# Logging
# =============================================
logging.level.com.trade=DEBUG
